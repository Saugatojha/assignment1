<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>

<h2>Feedback Form</h2>

<form>

  <!-- basic info -->
  <h3>Basic Information</h3>

  <label>Full Name:</label><br>
  <input type="text" name="fullname" placeholder="Enter your full name" required minlength="3" maxlength="60"><br><br>

  <label for="email">Email Address:</label><br>
  <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

  <!-- rating -->
  <h3>Rating</h3>

  <input type="radio" name="rating" value="very-satisfied" required> Very Satisfied<br>
  <input type="radio" name="rating" value="satisfied"> Satisfied<br>
  <input type="radio" name="rating" value="neutral"> Neutral<br>
  <input type="radio" name="rating" value="unsatisfied"> Unsatisfied<br><br>

  <h3>Interests</h3>

  <input type="checkbox" name="interests" value="web"> Web Development<br>
  <input type="checkbox" name="interests" value="mobile"> Mobile Development<br>
  <input type="checkbox" name="interests" value="ai"> AI & Machine Learning<br><br>

  <!-- country -->
  <h3>Country</h3>

  <label for="country">Select Country:</label><br>
  <select id="country" name="country">
    <option value="">-- Select --</option>
    <option value="nepal">Nepal</option>
    <option value="turkey">Turkey</option>
    <option value="indonesia">Indonesia</option>
  </select><br><br>

  <h3>Feedback</h3>
  <label>Write your feedback here</label><br>
  <textarea name="feedback" rows="5" cols="40" placeholder="Write your feedback here" required minlength="10" maxlength="500"></textarea><br><br>

  <input type="submit" value="Submit">

</form>

</body>
</html>
